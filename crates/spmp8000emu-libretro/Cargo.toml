[package]
name = "spmp8000emu-libretro"
version.workspace = true
edition.workspace = true
description = "libretro core for SPMP8000Emu (loadable by RetroArch)"
license.workspace = true

[lib]
# Keep this aligned with CORENAME in .gitlab-ci.yml. The buildbot appends
# `_libretro` to this core name when packaging the cdylib.
name = "spmp8000emu"
# `staticlib` is what the EmulatorJS build links into its RetroArch fork for
# the wasm target; desktop builds keep using the cdylib.
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
spmp8000emu-core.workspace = true
log.workspace = true
